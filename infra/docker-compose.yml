# Local-only data stack. Credentials are deliberately trivial and the ports are
# published on localhost: this is a development fixture, not a deployment.
services:
  db:
    # imresamu/postgis is the multi-arch build of the PostGIS image (the Docker
    # Hub postgis/postgis tags are amd64-only, which means Rosetta emulation on
    # Apple Silicon). Same Dockerfile lineage, native arm64.
    image: imresamu/postgis:16-3.4
    environment:
      POSTGRES_USER: taipei
      POSTGRES_PASSWORD: taipei
      POSTGRES_DB: taipei
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Server-side COPY reads these paths inside the container, which is far
      # faster than streaming 19 MB of CSV through psql's \copy.
      - ./data:/data:ro
      - ./sql:/sql:ro
      # The loader's fixtures. Mounted read-only like the rest: test/run.sh
      # points the same sql/ files at these paths in a scratch database, so the
      # loader is tested without a 163,000-row load and without touching data/.
      - ./test:/test:ro
    healthcheck:
      # -h 127.0.0.1 is load-bearing. During initdb the entrypoint runs a
      # temporary server on the unix socket only, so a socket-based pg_isready
      # reports healthy while the image's own postgis setup is still running —
      # and our CREATE EXTENSION then races it. Forcing TCP fails until the
      # real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U taipei -d taipei"]
      interval: 2s
      timeout: 3s
      retries: 30

  martin:
    image: ghcr.io/maplibre/martin:latest
    depends_on:
      db:
        condition: service_healthy
    # MARTIN_PORT moves the host side only, for a machine whose :3000 is
    # taken; Martin itself always listens on 3000 (martin.yaml). The app's
    # proxy must follow it: TILES_PROXY_TARGET, see app/src/lib/tiles/specs/proxy.md.
    ports:
      - "127.0.0.1:${MARTIN_PORT:-3000}:3000"
    volumes:
      - ./martin.yaml:/config/martin.yaml:ro
    command: ["--config", "/config/martin.yaml"]

  # The Gaussian splat capture files, which Martin cannot serve: Martin serves
  # tiles from the database, and a capture is a binary of hundreds of MB on
  # disk. A plain static server, read-only, over the mosaic's tiles (tiles/)
  # and their LoD trees (lod/, which the app draws). The app reaches it
  # through its /files proxy (FILES_PROXY_TARGET, app/src/lib/tiles/specs/proxy.md),
  # so the browser asks for /files/3dgs/<file>. FILES_PORT moves the host side
  # only, as MARTIN_PORT does for Martin; 3080 avoids 3000 and the 3001 a
  # remote host uses for Martin.
  files:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:${FILES_PORT:-3080}:80"
    volumes:
      - ./data/3dgs/tiles:/srv/3dgs:ro
      - ./data/3dgs/lod:/srv/3dgs-lod:ro
      - ./files.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
