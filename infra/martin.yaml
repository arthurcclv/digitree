# Martin publishes two sources: the `trees` table, as MVT layer `trees`, and
# the `splats` table, as MVT layer `splats` (see the end of this file).
# Each source id below is both the tile path (/trees/{z}/{x}/{y}) and the
# `source-layer` name the app's GeoLibre record must ask for.
listen_addresses: "0.0.0.0:3000"

postgres:
  connection_string: "postgres://taipei:taipei@db:5432/taipei"
  # Explicit rather than auto_publish, so the source id and therefore the MVT
  # layer name are ours and cannot drift when the schema gains a table.
  auto_publish: false
  tables:
    trees:
      schema: public
      table: trees
      srid: 4326
      geometry_column: geom
      # Must be an integer column — tree_id is text. See sql/01_schema.sql.
      id_column: id
      geometry_type: POINT
      # A point layer generalises to nothing — every tree survives to every
      # zoom — so the floor is set from measured tile weight, not taste:
      #
      #   z12  2.2 MB/tile   (the whole city in one tile)
      #   z14  485 KB, max 14,522 features, median 1,443
      #   z15  102 KB, max  6,760 features, median   801
      #   z16   21 KB, max  2,623 features, median   253
      #
      # 14 is the floor the app uses too, so an accidental zoomed-out request
      # cannot pull the whole city.
      minzoom: 14
      maxzoom: 20
      extent: 4096
      buffer: 64
      clip_geom: true
      properties:
        # Published as a property, not just as the row key: the three.js layer
        # reads these tiles back with querySourceFeatures, where a point inside
        # the tile buffer arrives once per covering tile, and tree_id is what
        # deduplicates it. Dropping it here makes the 3D layer render nothing.
        tree_id: text
        kind: text
        district: text
        place: text
        species: text
        height_m: real
        diameter_cm: real
        canopy_width_m: real
    # The Gaussian splat captures, as MVT layer `splats`: one point per capture,
    # at the origin 04_splats.sql solved from its control points. The app's
    # splat layer fetches these on the z14 grid to learn which captures are in
    # view, then fetches the files themselves from the `files` service. Both
    # names, and the property names below, are read by
    # app/src/layers/splat/schema.ts.
    splats:
      schema: public
      table: splats
      srid: 4326
      geometry_column: geom
      # Integer, as for trees; splat_id is text.
      id_column: id
      geometry_type: POINT
      # The app only ever asks for z14 (its tile grid), and a capture is not
      # worth loading from further out. 14-20 matches `trees`.
      minzoom: 14
      maxzoom: 20
      extent: 4096
      buffer: 64
      clip_geom: true
      properties:
        splat_id: text
        file: text
        bytes: int8
        altitude_m: real
        heading_deg: real
        scale: real
        # The exact origin. The point above is snapped to the 4096 grid of
        # the z14 tile the app reads, up to 0.27 m per axis, so the app takes
        # the origin from these and the point only places the capture in tiles.
        lng: float8
        lat: float8
