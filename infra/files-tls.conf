# The `files` service's HTTPS listener, with HTTP/2, so a browser can fetch a
# view's many .radc chunks over one multiplexed connection instead of
# HTTP/1.1's six (specs/files-http2.md). Browsers speak HTTP/2 over TLS only.
#
# Not in conf.d: files-tls.sh copies it there at container start only when
# the operator's cert.pem and key.pem are both in /etc/nginx/tls/. nginx
# itself then refuses a pair that does not match or is not PEM.
server {
  # ALPN offers h2, and http/1.1 to a client that asks for it.
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;

  include /etc/nginx/files-locations.conf;
}
