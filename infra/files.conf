# The `files` service: the splat capture files, read-only, at /3dgs/<file>,
# and their level-of-detail trees at /3dgs-lod/<scan>-lod.rad (a header) and
# /3dgs-lod/<scan>-lod-<n>.radc (its chunks). Replaces
# nginx's default server. See docker-compose.yml.
server {
  listen 80;
  server_name _;

  # Nothing but the captures is served.
  location / {
    return 404;
  }

  location /3dgs/ {
    alias /srv/3dgs/;
    autoindex off;

    # Large binaries straight from disk. Byte ranges are on by default for
    # static files; Spark fetches a whole .spz, but a resumed or partial read
    # must not be served the full 94 MB.
    sendfile on;
    tcp_nopush on;

    # SPZ is already gzip; compressing it again costs CPU and saves nothing.
    gzip off;
    types { }
    default_type application/octet-stream;

    # Revalidate every time, by ETag: a replaced capture is refetched, an
    # unchanged one costs a 304.
    etag on;
    add_header Cache-Control "no-cache" always;
  }

  # The paged LoD trees the app draws (build-lod.sh), chunked: Spark reads a
  # .rad header by byte range, then fetches each .radc chunk it needs whole.
  # Each chunk has its own ETag, so it is revalidated on its own.
  # Otherwise as /3dgs/.
  location /3dgs-lod/ {
    alias /srv/3dgs-lod/;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    gzip off;
    types { }
    default_type application/octet-stream;
    etag on;
    add_header Cache-Control "no-cache" always;
  }
}
