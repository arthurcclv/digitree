# The `files` service: the mosaic's tiles, read-only, at /3dgs/<tile>.ply,
# and their level-of-detail trees at /3dgs-lod/<tile>-lod.rad (a header) and
# /3dgs-lod/<tile>-lod-<n>.radc (its chunks). The app draws only the trees and
# never fetches a tile itself. Both locations send CORS headers, so a
# frontend on another origin can read them directly (specs/network-access.md).
# Replaces nginx's default server. See docker-compose.yml.
server {
  listen 80;
  server_name _;

  # Nothing but the captures is served.
  location / {
    return 404;
  }

  location /3dgs/ {
    alias /srv/3dgs/;
    autoindex off;

    # Large binaries straight from disk. Byte ranges are on by default for
    # static files, so a resumed or partial read is not served the whole
    # file.
    sendfile on;
    tcp_nopush on;

    # Served as stored: compressing a binary this size costs CPU per request.
    gzip off;
    types { }
    default_type application/octet-stream;

    # Revalidate every time, by ETag: a replaced capture is refetched, an
    # unchanged one costs a 304.
    etag on;
    add_header Cache-Control "no-cache" always;

    # CORS: the files are public, read-only and fetched without credentials,
    # so any origin may read them. The exposed headers are what a ranged
    # reader needs. `always` puts them on 206, 304 and 404 too. A location's
    # add_header replaces any inherited one, so /3dgs-lod/ repeats these.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Max-Age 86400 always;

    # The preflight: a Range request that is not CORS-safelisted asks first.
    if ($request_method = OPTIONS) {
      return 204;
    }
  }

  # The paged LoD trees the app draws (build-lod.sh), chunked: Spark reads a
  # .rad header by byte range, then fetches each .radc chunk it needs whole.
  # Each chunk has its own ETag, so it is revalidated on its own.
  # Otherwise as /3dgs/, CORS included.
  location /3dgs-lod/ {
    alias /srv/3dgs-lod/;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    gzip off;
    types { }
    default_type application/octet-stream;
    etag on;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Max-Age 86400 always;
    if ($request_method = OPTIONS) {
      return 204;
    }
  }
}
