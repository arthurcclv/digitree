# The `files` service's plain-HTTP listener, HTTP/1.1, which the app's /files
# proxy and existing clients use. What it serves is files-locations.conf,
# shared with the HTTPS listener in files-tls.conf. Replaces nginx's default
# server. See docker-compose.yml.
server {
  listen 80;
  server_name _;

  include /etc/nginx/files-locations.conf;
}
